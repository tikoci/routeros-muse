# routeros-muse packaged doctor spec (T30 prototype, D15/D20).
# Mac first; windows/linux entries are real detects with print-only
# hints, stub-grade until their turn (D14). A workspace may add
# doctor.local.toml with more [[tool]] entries; same id+os overrides
# the base entry, new ids append. Never a fork.
#
# Fields: id, os (mac|windows|linux), tier
# (required|recommended|helpful), detect (shell check, exit 0 =
# present), hint (install suggestion, never run for system-level),
# why (one line, shown verbatim), skills (xrefs that benefit),
# required_for (skills that escalate this tool to required-for-this-skill).

[[tool]]
id = "muse"
os = "mac"
tier = "required"
detect = "command -v muse"
hint = "curl -fsSL https://dev.meta.ai/install.sh | bash"
why = "the local coding agent Mode A launches; without it the bootstrap has nowhere to hand off"
skills = []
required_for = []

