# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Same policy as tikoci/quickchr and tikoci/centrs, to conserve the org's
# CodeRabbit credits:
#   - review only when a PR is marked ready for review (skip drafts)
#   - one review per ready PR; no automatic per-push incremental re-reviews
#   - re-review on demand with an `@coderabbitai review` PR comment
# poem and in_progress_fortune both default to true, so the `false` settings
# below are load-bearing.
#
# CodeRabbit applies this file from the BASE branch only: an edit here takes
# effect for PRs opened after it merges to main, never for the PR that makes it.
language: en-US
tone_instructions: >
  Terse and actionable. No poems, jokes, or decorative filler. State the
  finding, the file/line, and the fix. Skip praise and preamble.
reviews:
  profile: assertive
  review_details: true
  enable_prompt_for_ai_agents: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
    ignore_usernames:
      - dependabot[bot]
  tools:
    github-checks:
      enabled: true
      timeout_ms: 420000
  poem: false
  in_progress_fortune: false
  path_instructions:
    - path: "records/*.toml"
      instructions: >
        The project tracker (contract: records/README.md). Check that a record
        changed by this PR matches the code change: status and evidence are
        claims, and evidence should name a command and its output, not prose.
